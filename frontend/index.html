<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyGrid Live</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Cesium.js"></script>
  <script src="https://unpkg.com/satellite.js@6.0.1/dist/satellite.min.js"></script>

  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.117/Build/Cesium/Widgets/widgets.css" />

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020712;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(0,255,255,.12), transparent 35%),
        radial-gradient(circle at top right, rgba(40,90,255,.12), transparent 35%),
        #020712;
    }

    .overlay,
    .details-panel {
      position: absolute;
      z-index: 1000;
      color: white;
      background: linear-gradient(180deg, rgba(5,15,35,.86), rgba(3,9,24,.78));
      border: 1px solid rgba(0, 255, 255, 0.26);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 40px rgba(0, 220, 255, 0.14);
    }

    .overlay {
      top: 10px;
      left: 10px;
      width: 142px;
      min-width: 0;
      max-width: 142px;
      padding: 7px;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0, 220, 255, 0.10);
    }

    .details-panel {
      top: 22px;
      right: 22px;
      width: 330px;
      padding: 20px;
      display: none;
    }

    .brand-link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
      margin-bottom: 4px;
    }

    .title {
      color: #69f3ff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 0 12px rgba(105,243,255,.16);
    }

    .subtitle {
      display: none;
    }

    .panel-divider {
      height: 1px;
      margin: 6px 0;
      background: linear-gradient(90deg, rgba(105,243,255,.22), rgba(105,243,255,.03));
    }

    .metric {
      display: none;
    }

    .status {
      margin-top: 4px;
      color: #8ff7ff;
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 7px 10px;
      color: #8ff7ff;
      font-size: 12px;
      border: 1px solid rgba(0,255,255,.22);
      border-radius: 999px;
      background: rgba(0,255,255,.08);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #69f3ff;
      box-shadow: 0 0 14px rgba(105,243,255,.9);
    }

    .button-stack {
      margin-top: 6px;
      display: grid;
      gap: 4px;
    }

    .close-button,
    .news-button,
    .live-button,
    .x-button {
      width: 100%;
      padding: 5px 6px;
      border-radius: 999px;
      cursor: pointer;
      box-sizing: border-box;
      font-size: 10px;
      text-align: center;
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .news-button {
      color: #02121e;
      border: 1px solid rgba(105,243,255,.8);
      background: linear-gradient(135deg, #69f3ff, #18a8ff);
      font-weight: 700;
      box-shadow: 0 0 22px rgba(24,168,255,.22);
    }

    .live-button,
    .close-button {
      background: rgba(0,255,255,.10);
      color: #8ff7ff;
      border: 1px solid rgba(0,255,255,.28);
    }

    .x-button {
      background: rgba(255,255,255,.045);
      color: #d0d7e2;
      border: 1px solid rgba(255,255,255,.11);
      font-size: 10px;
    }

    .news-button:hover,
    .live-button:hover,
    .close-button:hover,
    .x-button:hover {
      transform: translateY(-1px);
    }

    .live-button:hover,
    .close-button:hover {
      background: rgba(0,255,255,.18);
    }

    .x-button:hover {
      color: #8ff7ff;
      border-color: rgba(0,255,255,.28);
      background: rgba(0,255,255,.08);
    }

    .details-title {
      color: #69f3ff;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: .5px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 0;
      font-size: 13px;
    }

    .detail-label {
      color: #9fb6c8;
    }

    .detail-value {
      color: #ffffff;
      text-align: right;
      word-break: break-word;
    }

    .cesium-viewer-bottom,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer {
      display: none !important;
    }

    @media (max-width: 760px) {
      .overlay {
        top: 8px;
        left: 8px;
        right: auto;
        width: 136px;
        min-width: 0;
        max-width: 136px;
        padding: 6px;
        border-radius: 10px;
      }

      .title {
        font-size: 15px;
      }

      .panel-divider {
        margin: 5px 0;
      }

      .button-stack {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .details-panel {
        left: 12px;
        right: 12px;
        top: auto;
        bottom: 12px;
        width: auto;
        max-height: 46vh;
        overflow: auto;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <div class="overlay">
    <a class="brand-link" href="/">
      <div class="title">SKYGRID</div>
    </a>
    <div class="subtitle">Live Constellation</div>

    <div class="panel-divider"></div>

    <div class="metric" id="satelliteCount">🛰 Loading satellites...</div>
    <div class="status" id="status">Loading Earth...</div>
    <div class="status-badge"><span class="status-dot"></span><span>Live tracking defaults to 3-second updates</span></div>

    <div class="button-stack">
      <a class="news-button" href="/news.html">📰 News</a>
      <button class="live-button" id="liveModeButton">Live: Starting</button>
      <a class="x-button" href="https://x.com/SkyGrid_Space" target="_blank" rel="noopener">𝕏 Follow</a>
    </div>
  </div>

  <div class="details-panel" id="detailsPanel">
    <div class="details-title" id="detailsTitle">Satellite</div>

    <div class="detail-row">
      <div class="detail-label">NORAD</div>
      <div class="detail-value" id="detailsNorad">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Launch Date</div>
      <div class="detail-value" id="detailsLaunchDate">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Launch Age</div>
      <div class="detail-value" id="detailsLaunchAge">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Launch Site</div>
      <div class="detail-value" id="detailsLaunchSite">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Object ID</div>
      <div class="detail-value" id="detailsObjectId">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Object Type</div>
      <div class="detail-value" id="detailsObjectType">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Altitude</div>
      <div class="detail-value" id="detailsAltitude">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Inclination</div>
      <div class="detail-value" id="detailsInclination">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Mean Motion</div>
      <div class="detail-value" id="detailsMeanMotion">-</div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Epoch</div>
      <div class="detail-value" id="detailsEpoch">-</div>
    </div>

    <button class="close-button" onclick="hideDetailsPanel()">Close</button>
  </div>

  <script>
    let selectedEntity = null;
    let satelliteEntries = [];
    let satcatLookup = {};
    let liveModeEnabled = false;
    let liveUpdateTimer = null;
    let spinEnabled = true;
    let viewerInstance = null;

    const LIVE_UPDATE_INTERVAL_MS = 3000;
    const GLOBE_ROTATION_RATE = 0.000035;

    const satelliteScaleByDistance = new Cesium.NearFarScalar(
      1000000,
      3.0,
      30000000,
      0.35
    );

    const defaultPointStyle = {
      pixelSize: 5,
      color: Cesium.Color.CYAN.withAlpha(0.65),
      outlineColor: Cesium.Color.TRANSPARENT,
      outlineWidth: 0
    };

    const selectedPointStyle = {
      pixelSize: 12,
      color: Cesium.Color.WHITE,
    };

    async function loadStarlinkData() {
      const response = await fetch("/data/starlink/latest/starlink.json?t=" + Date.now());

      if (!response.ok) {
        throw new Error("Failed to load Starlink data: HTTP " + response.status);
      }

      const satellites = await response.json();

      document.getElementById("satelliteCount").textContent =
        "🛰 " + satellites.length.toLocaleString() + " satellites loaded";

      return satellites;
    }

    async function loadSatcatLookup() {
      try {
        const response = await fetch("/data/satcat/latest/starlink_lookup.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Failed to load SATCAT lookup: HTTP " + response.status);
        }

        satcatLookup = await response.json();
        console.log("Loaded SATCAT lookup entries:", Object.keys(satcatLookup).length);
      } catch (error) {
        satcatLookup = {};
        console.warn("SATCAT lookup unavailable. Launch metadata will be hidden.", error);
      }
    }

    function getSatcatMetadata(sat) {
      const norad = sat && sat.NORAD_CAT_ID !== undefined && sat.NORAD_CAT_ID !== null
        ? String(sat.NORAD_CAT_ID)
        : "";

      if (!norad) return {};
      return satcatLookup[norad] || {};
    }

    function formatLaunchDate(value) {
      if (!value) return "-";

      const date = new Date(value + "T00:00:00Z");

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("en-AU", {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function calculateLaunchAge(value) {
      if (!value) return "-";

      const launchDate = new Date(value + "T00:00:00Z");

      if (Number.isNaN(launchDate.getTime())) {
        return "-";
      }

      const now = new Date();
      const ageDays = Math.max(0, Math.floor((now - launchDate) / 86400000));

      return ageDays.toLocaleString() + " days";
    }

    function calculateSatellitePositionFromSatrec(satrec) {
      const now = new Date();
      const positionAndVelocity = satellite.propagate(satrec, now);

      if (!positionAndVelocity.position) {
        throw new Error("Could not propagate satellite position");
      }

      const gmst = satellite.gstime(now);
      const geodetic = satellite.eciToGeodetic(positionAndVelocity.position, gmst);

      return {
        longitude: satellite.degreesLong(geodetic.longitude),
        latitude: satellite.degreesLat(geodetic.latitude),
        altitudeMeters: geodetic.height * 1000
      };
    }

    function formatNumber(value, decimals) {
      if (value === undefined || value === null || Number.isNaN(Number(value))) {
        return "-";
      }

      return Number(value).toFixed(decimals);
    }

    function showDetailsPanel(sat, position) {
      document.getElementById("detailsTitle").textContent =
        sat.OBJECT_NAME || "Unknown satellite";

      document.getElementById("detailsNorad").textContent =
        sat.NORAD_CAT_ID || "-";

      const satcat = getSatcatMetadata(sat);

      document.getElementById("detailsLaunchDate").textContent =
        formatLaunchDate(satcat.launch_date);

      document.getElementById("detailsLaunchAge").textContent =
        calculateLaunchAge(satcat.launch_date);

      document.getElementById("detailsLaunchSite").textContent =
        satcat.launch_site || "-";

      document.getElementById("detailsObjectId").textContent =
        satcat.object_id || sat.OBJECT_ID || "-";

      document.getElementById("detailsObjectType").textContent =
        satcat.object_type || "-";

      document.getElementById("detailsAltitude").textContent =
        formatNumber(position.altitudeMeters / 1000, 1) + " km";

      document.getElementById("detailsInclination").textContent =
        formatNumber(sat.INCLINATION, 2) + "°";

      document.getElementById("detailsMeanMotion").textContent =
        formatNumber(sat.MEAN_MOTION, 5);

      document.getElementById("detailsEpoch").textContent =
        sat.EPOCH || "-";

      document.getElementById("detailsPanel").style.display = "block";
    }

    function applyDefaultStyle(entity) {
      if (!entity || !entity.point) return;

      entity.point.pixelSize = defaultPointStyle.pixelSize;
      entity.point.color = defaultPointStyle.color;
      entity.point.outlineColor = defaultPointStyle.outlineColor;
      entity.point.outlineWidth = defaultPointStyle.outlineWidth;
    }

    function applySelectedStyle(entity) {
      if (!entity || !entity.point) return;

      entity.point.pixelSize = selectedPointStyle.pixelSize;
      entity.point.color = selectedPointStyle.color;
      entity.point.outlineColor = selectedPointStyle.outlineColor;
      entity.point.outlineWidth = selectedPointStyle.outlineWidth;
    }

    function hideDetailsPanel() {
      document.getElementById("detailsPanel").style.display = "none";

      if (selectedEntity) {
        applyDefaultStyle(selectedEntity);
        selectedEntity = null;
      }
    }

    function addRealSatellite(viewer, sat) {
      const satrec = satellite.json2satrec(sat);
      const position = calculateSatellitePositionFromSatrec(satrec);

      const entity = viewer.entities.add({
        name: sat.OBJECT_NAME,
        position: Cesium.Cartesian3.fromDegrees(
          position.longitude,
          position.latitude,
          position.altitudeMeters
        ),
        point: {
          pixelSize: defaultPointStyle.pixelSize,
          color: defaultPointStyle.color,
          outlineColor: defaultPointStyle.outlineColor,
          outlineWidth: defaultPointStyle.outlineWidth,
          scaleByDistance: satelliteScaleByDistance
        },
        properties: {
          satelliteData: sat,
          calculatedPosition: position
        }
      });

      satelliteEntries.push({
        sat,
        satrec,
        entity,
        position
      });

      return entity;
    }

    function updateSatellitePositions() {
      let updatedCount = 0;

      for (const entry of satelliteEntries) {
        try {
          const position = calculateSatellitePositionFromSatrec(entry.satrec);

          entry.position = position;

          entry.entity.position = Cesium.Cartesian3.fromDegrees(
            position.longitude,
            position.latitude,
            position.altitudeMeters
          );

          entry.entity.properties.calculatedPosition = position;

          if (selectedEntity === entry.entity) {
            showDetailsPanel(entry.sat, position);
          }

          updatedCount++;
        } catch (err) {
          console.warn("Failed to update satellite:", entry.sat.OBJECT_NAME, err);
        }
      }

      document.getElementById("status").textContent =
        "🛰 " + updatedCount.toLocaleString() + " live";
    }

    function setLiveMode(enabled) {
      liveModeEnabled = enabled;

      const button = document.getElementById("liveModeButton");

      if (liveModeEnabled) {
        button.textContent = "Live: On";
        document.getElementById("status").textContent = "Starting live mode...";

        if (liveUpdateTimer) {
          clearInterval(liveUpdateTimer);
          liveUpdateTimer = null;
        }

        updateSatellitePositions();

        liveUpdateTimer = setInterval(
          updateSatellitePositions,
          LIVE_UPDATE_INTERVAL_MS
        );
      } else {
        button.textContent = "Live: Off";

        if (liveUpdateTimer) {
          clearInterval(liveUpdateTimer);
          liveUpdateTimer = null;
        }

        document.getElementById("status").textContent =
          "🛰 " + satelliteEntries.length.toLocaleString() + " static";
      }
    }

    function setupLiveModeButton() {
      const button = document.getElementById("liveModeButton");

      button.addEventListener("click", function () {
        setLiveMode(!liveModeEnabled);
      });
    }

    function setupGlobeSpin(viewer) {
      viewer.clock.onTick.addEventListener(function () {
        if (!spinEnabled) return;
        viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -GLOBE_ROTATION_RATE);
      });

      const canvas = viewer.scene.canvas;
      ["mousedown", "touchstart", "wheel"].forEach(function (eventName) {
        canvas.addEventListener(eventName, function () {
          spinEnabled = false;
        }, { passive: true });
      });
    }

    function findNearestSatelliteFromTap(viewer, tapPosition, maxDistancePixels) {
      let nearestEntry = null;
      let nearestDistance = maxDistancePixels;

      const occluder = new Cesium.EllipsoidalOccluder(
        viewer.scene.globe.ellipsoid,
        viewer.camera.positionWC
      );

      for (const entry of satelliteEntries) {
        if (!entry.entity || !entry.entity.position) continue;

        const cartesian = entry.entity.position.getValue(viewer.clock.currentTime);
        if (!cartesian) continue;

        if (!occluder.isPointVisible(cartesian)) {
          continue;
        }

        const screenPosition = Cesium.SceneTransforms.wgs84ToWindowCoordinates(
          viewer.scene,
          cartesian
        );

        if (!screenPosition) continue;

        if (
          screenPosition.x < 0 ||
          screenPosition.y < 0 ||
          screenPosition.x > viewer.canvas.clientWidth ||
          screenPosition.y > viewer.canvas.clientHeight
        ) {
          continue;
        }

        const dx = screenPosition.x - tapPosition.x;
        const dy = screenPosition.y - tapPosition.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance <= nearestDistance) {
          nearestDistance = distance;
          nearestEntry = entry;
        }
      }

      return nearestEntry;
    }

    function setupClickHandler(viewer) {
      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

      const isTouchDevice =
        window.matchMedia("(pointer: coarse)").matches ||
        "ontouchstart" in window;

      handler.setInputAction(function (movement) {
        let picked = viewer.scene.pick(movement.position);
        let entity = null;

        if (
          Cesium.defined(picked) &&
          picked.id &&
          picked.id.properties &&
          picked.id.properties.satelliteData
        ) {
          entity = picked.id;
        }

        if (!entity && isTouchDevice) {
          const nearestEntry = findNearestSatelliteFromTap(
            viewer,
            movement.position,
            35
          );

          if (nearestEntry) {
            entity = nearestEntry.entity;
          }
        }

        if (!entity) {
          hideDetailsPanel();
          return;
        }

        if (selectedEntity) {
          applyDefaultStyle(selectedEntity);
        }

        selectedEntity = entity;
        applySelectedStyle(selectedEntity);

        const time = viewer.clock.currentTime;
        const sat = selectedEntity.properties.satelliteData.getValue(time);
        const position = selectedEntity.properties.calculatedPosition.getValue(time);

        showDetailsPanel(sat, position);

      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }

    async function startSkyGrid() {
      if (typeof satellite === "undefined") {
        throw new Error("satellite.js failed to load");
      }

      setupLiveModeButton();
      loadSatcatLookup();

      const imageryProvider =
        await Cesium.ArcGisMapServerImageryProvider.fromUrl(
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
        );

      const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Promise.resolve(imageryProvider)
        ),
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false
      });

      viewerInstance = viewer;
      viewer.scene.globe.enableLighting = true;
      viewer.scene.skyAtmosphere.show = true;
      viewer.scene.backgroundColor = Cesium.Color.BLACK;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(135, -25, 25000000)
      });

      setupGlobeSpin(viewer);

      document.getElementById("status").textContent = "Earth online";

      const satellites = await loadStarlinkData();

      let plottedCount = 0;

      for (const sat of satellites) {
        try {
          addRealSatellite(viewer, sat);
          plottedCount++;
        } catch (err) {
          console.warn("Failed to plot satellite:", sat.OBJECT_NAME, err);
        }
      }

      setupClickHandler(viewer);

      document.getElementById("status").textContent =
        "🛰 " + plottedCount.toLocaleString() + " ready";

      setLiveMode(true);
    }

    startSkyGrid().catch(error => {
      console.error(error);

      document.getElementById("status").textContent =
        "Error: " + error.message;

      document.getElementById("satelliteCount").textContent =
        "🛰 Satellite data unavailable";
    });
  </script>
</body>
</html>
