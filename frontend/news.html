<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyGrid Daily News</title>
  <style>
    html, body { margin:0; padding:0; background:#020712; color:white; font-family:Arial, Helvetica, sans-serif; }
    body { min-height:100vh; background:radial-gradient(circle at top left, rgba(0,255,255,.12), transparent 35%), radial-gradient(circle at top right, rgba(40,90,255,.12), transparent 35%), #020712; }
    .page { max-width:1180px; margin:0 auto; padding:24px; }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:32px; }
    .logo { text-decoration:none; color:white; }
    .logo-main { color:#69f3ff; font-size:34px; font-weight:bold; letter-spacing:3px; }
    .logo-sub { margin-top:4px; color:#d0d7e2; font-size:14px; letter-spacing:1px; text-transform:uppercase; }
    .meta { text-align:right; color:#9fb6c8; font-size:14px; line-height:1.6; }
    .hero, .story, .archive { border:1px solid rgba(0,255,255,.24); border-radius:16px; background:rgba(5,15,35,.72); box-shadow:0 0 32px rgba(0,220,255,.12); backdrop-filter:blur(10px); overflow:hidden; }
    .hero { margin-bottom:34px; }
    .hero-image { height:540px; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:linear-gradient(135deg, rgba(0,255,255,.18), rgba(0,0,0,.45)), radial-gradient(circle, rgba(105,243,255,.16), transparent 45%); color:#69f3ff; font-size:26px; font-weight:bold; letter-spacing:2px; }
    .hero-image img,
      .story-image img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        display: block;
    }
    .hero-content, .story-content { padding:28px; }
    .label { color:#69f3ff; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
    .hero-title { font-size:40px; font-weight:bold; line-height:1.12; margin-bottom:14px; }
    .big-number, .story-number { color:#69f3ff; font-weight:bold; margin-bottom:16px; }
    .big-number { font-size:46px; }
    .body-text { color:#d0d7e2; line-height:1.75; font-size:16px; }
    .story { display:grid; grid-template-columns:420px 1fr; gap:24px; margin-bottom:26px; }
    .story-image { min-height:300px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; background:linear-gradient(135deg, rgba(0,255,255,.13), rgba(0,0,0,.42)), radial-gradient(circle, rgba(105,243,255,.10), transparent 50%); color:#69f3ff; font-weight:bold; font-size:18px; letter-spacing:1px; }
    .story-title { font-size:28px; font-weight:bold; margin-bottom:12px; }
    .story-number { font-size:34px; }
    .evidence { margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); color:#8ff7ff; font-size:13px; line-height:1.5; }
    .archive { margin-top:42px; padding:24px; }
    .archive-title { color:#69f3ff; font-size:22px; font-weight:bold; margin-bottom:16px; }
    .archive-link { display:inline-block; margin:5px; padding:10px 14px; border-radius:8px; border:1px solid rgba(0,255,255,.3); background:rgba(0,255,255,.12); color:#8ff7ff; font-size:14px; }
    .footer { color:#66798d; font-size:12px; text-align:center; padding:34px 0 10px; }
    @media (max-width:860px) {
      .page { padding:18px; }
      .header { flex-direction:column; }
      .meta { text-align:left; }
      .hero-image { height:310px; font-size:20px; }
      .hero-title { font-size:30px; }
      .big-number { font-size:36px; }
      .story { grid-template-columns:1fr; }
      .story-image { min-height:240px; }
      .story-title { font-size:24px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <a class="logo" href="/">
        <div class="logo-main">SKYGRID</div>
      </a>
      <div class="logo-sub">Daily News</div>
      <div class="meta">
        <div id="newsDate">Loading...</div>
        <div id="newsSubtitle">Loading SkyGrid daily package...</div>
        <div>Generated from SkyGrid daily evidence</div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-image" id="heroImage">LOADING HERO STORY</div>
      <div class="hero-content">
        <div class="label">Daily Lead</div>
        <div class="hero-title" id="heroHeadline">Loading...</div>
        <div class="body-text" id="heroBody">Loading latest SkyGrid daily news package...</div>
        <div class="evidence" id="heroEvidence"></div>
      </div>
    </section>

    <div id="stories"></div>

    <section class="archive">
      <div class="archive-title">Previous Reports</div>
      <div id="archiveLinks">
        <div class="archive-link">Loading archive...</div>
      </div>
    </section>

    <div class="footer">
      SkyGrid Daily News • Loaded from S3 published news-site package
    </div>
  </main>

 <script>
  function stripCodeFence(text) {
    return text
      .replace(/^```json\s*/i, "")
      .replace(/^```\s*/i, "")
      .replace(/```$/i, "")
      .trim();
  }

  function unwrapPackage(wrapper) {
    const text = wrapper?.response?.result?.content?.[0]?.text;
    if (!text) return wrapper;
    return JSON.parse(stripCodeFence(text));
  }

  function setText(id, value) {
    document.getElementById(id).textContent = value || "";
  }

  function renderImage(container, story, fallback) {
  container.innerHTML = "";

  if (story.image_url) {
    const img = document.createElement("img");
    img.src = story.image_url + "?t=" + Date.now();
    img.alt = story.headline || fallback;
    img.loading = "lazy";
    container.appendChild(img);
    return;
  }

  container.textContent = story.image_prompt
    ? story.image_prompt.substring(0, 180) + "..."
    : fallback;
}







  function toFetchPath(key) {
    return key.startsWith("/") ? key : "/" + key;
  }

  function renderNews(data, wrapper) {
    const reportDate = wrapper.generated_at
  ? new Date(wrapper.generated_at).toLocaleDateString("en-AU", {
      day: "numeric",
      month: "long",
      year: "numeric",
      timeZone: "Australia/Melbourne"
    })
  : "SkyGrid Daily";

setText("newsDate", reportDate);
setText("newsSubtitle", data.title || "SkyGrid Daily News");





    renderImage(
  document.getElementById("heroImage"),
  data.hero,
  "HERO DAILY NEWS IMAGE"
);
    setText("heroHeadline", data.hero.headline);
    setText("heroBody", data.hero.detailed_body || data.hero.short_summary);
    setText("heroEvidence", "Evidence note: " + (data.hero.evidence_note || ""));

    const storiesContainer = document.getElementById("stories");
    storiesContainer.innerHTML = "";

    data.stories.forEach((story) => {
      const section = document.createElement("section");
      section.className = "story";

      const image = document.createElement("div");
      image.className = "story-image";
      
      renderImage(
      image,
      story,
      "STORY IMAGE"
      );

      const content = document.createElement("div");
      content.className = "story-content";

      content.innerHTML = `
        <div class="label">Story ${story.story_number}</div>
        <div class="story-title"></div>
        <div class="body-text"></div>
        <div class="evidence"></div>
      `;

      content.querySelector(".story-title").textContent = story.headline || "";
      content.querySelector(".body-text").textContent = story.detailed_body || story.short_summary || "";
      content.querySelector(".evidence").textContent = "Evidence note: " + (story.evidence_note || "");

      section.appendChild(image);
      section.appendChild(content);
      storiesContainer.appendChild(section);
    });
  }

  async function loadNewsPackage(key) {
    const response = await fetch(toFetchPath(key) + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const wrapper = await response.json();
    const data = unwrapPackage(wrapper);
    renderNews(data, wrapper);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function loadLatestNews() {
    try {
      await loadNewsPackage("published/news-site/latest/package.json");
    } catch (error) {
      console.error(error);
      setText("heroHeadline", "SkyGrid Daily News unavailable");
      setText("heroBody", "Could not load published/news-site/latest/package.json");
    }
  }

 async function loadArchiveLinks() {
  const archiveLinks = document.getElementById("archiveLinks");

  try {
    const response = await fetch("/published/news-site/archive/index.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const archiveIndex = await response.json();
    archiveLinks.innerHTML = "";

    if (!archiveIndex.length) {
      archiveLinks.innerHTML = '<div class="archive-link">No archived reports yet</div>';
      return;
    }

    const latestResponse = await fetch("/published/news-site/latest/package.json?t=" + Date.now());
    const latestWrapper = await latestResponse.json();

    const latestDate = latestWrapper.generated_at
      ? latestWrapper.generated_at.slice(0, 10)
      : null;

    const previousReports = archiveIndex.filter((item) => {
      return !latestDate || item.date !== latestDate;
    });

    if (!previousReports.length) {
      archiveLinks.innerHTML = '<div class="archive-link">No previous reports yet</div>';
      return;
    }

    previousReports.forEach((item) => {
      const button = document.createElement("button");
      button.className = "archive-link";
      button.textContent = item.label || item.date || item.run_id;

      button.addEventListener("click", async () => {
        try {
          await loadNewsPackage(item.package_key);
        } catch (error) {
          console.error(error);
          alert("Could not load archived report.");
        }
      });

      archiveLinks.appendChild(button);
    });
  } catch (error) {
    console.error(error);
    archiveLinks.innerHTML = '<div class="archive-link">Archive unavailable</div>';
  }
}

  loadLatestNews();
  loadArchiveLinks();
</script>
</body>
</html>
