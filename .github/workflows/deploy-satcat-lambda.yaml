name: Deploy SkyGrid SATCAT Lambda

on:
  push:
    branches:
      - main
    paths:
      - "lambda-satcat/**"
      - ".github/workflows/deploy-satcat-lambda.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: skygrid-celestrak-satcat-fetcher
  AWS_ROLE_ARN: arn:aws:iam::134387458447:role/skygrid-github-lambda-deploy-role

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Package SATCAT Lambda
        run: |
          cd lambda-satcat
          zip -r ../satcat-lambda-package.zip .

      - name: Deploy SATCAT Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://satcat-lambda-package.zip